{% extends "base.html" %}
{% block content %}
<section class="page-heading page-heading--compact">
  <div>
    <p class="eyebrow">Get started</p>
    <h1>Sign Up</h1>
    <p class="lede">Create an account and start building your workout history.</p>
  </div>
</section>

<section class="card form-card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="btn-row">
      <button class="btn btn-primary" type="submit">Create Account</button>
    </div>
  </form>

  <p class="small muted">
    Already have an account? <a class="text-link" href="{% url 'login' %}">Login</a>
  </p>
</section>
{% endblock %}
