{% extends "base.html" %}
{% block content %}
<section class="page-heading page-heading--compact">
  <div>
    <p class="eyebrow">Welcome back</p>
    <h1>Login</h1>
    <p class="lede">Pick up where your training log left off.</p>
  </div>
</section>

<section class="card form-card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="btn-row">
      <button class="btn btn-primary" type="submit">Login</button>
    </div>
  </form>

  <p class="small muted">
    No account yet? <a class="text-link" href="{% url 'signup' %}">Sign up</a>
  </p>
</section>
{% endblock %}
