{% extends "base.html" %}
{% block content %}
<section class="card form-card">
  <p class="eyebrow">Danger zone</p>
  <h1>Delete Exercise Entry</h1>
  <p class="lede">Delete "{{ object.name }}" from "{{ object.workout.title }}"?</p>

  <form method="post">
    {% csrf_token %}
    <div class="btn-row">
      <button class="btn btn-danger" type="submit">Confirm Delete</button>
      <a class="btn" href="{% url 'workouts_detail' object.workout.id %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
