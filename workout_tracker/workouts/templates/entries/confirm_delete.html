{% extends "base.html" %}
{% block content %}
<h1>Delete Exercise Entry</h1>
<p>Delete "{{ object.name }}" from "{{ object.workout.title }}"?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Confirm Delete</button>
</form>

<p><a href="{% url 'workouts_detail' object.workout.id %}">Cancel</a></p>
{% endblock %}
