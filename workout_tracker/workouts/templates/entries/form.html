{% extends "base.html" %}
{% block content %}
<section class="page-heading page-heading--compact">
  <div>
    <p class="eyebrow">Exercise entry</p>
    <h1>{% if object %}Edit Entry{% else %}Add Entry{% endif %}</h1>
    <p class="lede">Save the working sets, load, and notes for this exercise.</p>
  </div>
</section>

<section class="card form-card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="btn-row">
      <button class="btn btn-primary" type="submit">Save Entry</button>
      {% if object %}
      <a class="btn" href="{% url 'workouts_detail' object.workout.id %}">Cancel</a>
      {% else %}
      <a class="btn" href="{% url 'workouts_index' %}">Back</a>
      {% endif %}
    </div>
  </form>
</section>
{% endblock %}
