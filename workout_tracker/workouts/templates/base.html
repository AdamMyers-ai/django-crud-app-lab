{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Tracker</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{% url 'home' %}">Workout Tracker</a>

        <nav class="nav">
          <a class="nav-link" href="{% url 'workouts_index' %}">Workouts</a>
          <a class="nav-link" href="{% url 'tags_index' %}">Tags</a>

          {% if user.is_authenticated %}
          <span class="nav-text">Hi, {{ user.username }}</span>
          <a class="nav-link" href="{% url 'logout' %}">Logout</a>
          {% else %}
          <a class="nav-link" href="{% url 'login' %}">Login</a>
          <a class="nav-link btn btn-primary" href="{% url 'signup' %}"
            >Sign Up</a
          >
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="container page">{% block content %}{% endblock %}</main>
  </body>
</html>
