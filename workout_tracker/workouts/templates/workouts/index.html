{% extends "base.html" %} {% block content %}
<h1>Your Workouts</h1>
<p>
  <a class="btn btn-primary" href="{% url 'workouts_create' %}"
    >+ New Workout</a
  >
</p>

{% for w in workouts %}
<div class="card">
  <div class="card-title">
    <a href="{% url 'workouts_detail' w.id %}">
      <strong>{{ w.date }}</strong> — {{ w.title }}
    </a>
    {% if w.is_pr %}
    <span class="badge badge-pr">✅ PR</span>
    {% endif %}
  </div>

  {% if w.program_name %}
  <div class="small muted">Program: {{ w.program_name }}</div>
  {% endif %}
</div>
{% empty %}
<div class="card">No workouts yet.</div>
{% endfor %} {% endblock %}
