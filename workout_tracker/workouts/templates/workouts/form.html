{% extends "base.html" %}
{% block content %}
<h1>{% if object %}Edit Workout{% else %}New Workout{% endif %}</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
</form>

{% if object %}
<p><a href="{% url 'workouts_detail' object.id %}">Cancel</a></p>
{% else %}
<p><a href="{% url 'workouts_index' %}">Cancel</a></p>
{% endif %}
{% endblock %}
