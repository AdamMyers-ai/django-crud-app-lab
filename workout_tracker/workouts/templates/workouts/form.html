{% extends "base.html" %}
{% block content %}
<section class="page-heading page-heading--compact">
  <div>
    <p class="eyebrow">Workout</p>
    <h1>{% if object %}Edit Workout{% else %}New Workout{% endif %}</h1>
    <p class="lede">Capture the details of a training session.</p>
  </div>
</section>

<section class="card form-card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="btn-row">
      <button class="btn btn-primary" type="submit">Save Workout</button>
      {% if object %}
      <a class="btn" href="{% url 'workouts_detail' object.id %}">Cancel</a>
      {% else %}
      <a class="btn" href="{% url 'workouts_index' %}">Cancel</a>
      {% endif %}
    </div>
  </form>
</section>
{% endblock %}
